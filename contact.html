    <main>
        <h2>Our Contact Form</h2>

        <form action="https//httpbin.org/get" method="get">
            <fieldset>
                <legend>Send Us A Message</legend>

                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" autofocus="on" autocomplete placeholder="your name"
                        required>
                </p>

                <p>
                    <label for="email">Email</label>


                    <input type="text" name="email" id="email" required placeholder="your email">
                </p>

                <p>
                    <label for="message">your message:</label>
                    <br> <!--for the box to go under the label-->
                    <textarea name="message" id="message" placeholder="type your message here" cols="28"
                        rows="7"></textarea>
                </p>

                <button type="submit">send</button>

                <button type="reset">reset</button>

            </fieldset>
        </form>
